<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-labelledby="n10Title n10Desc">
  <title id="n10Title">Sơ đồ quy trình hợp tác trực tuyến 3 giai đoạn của Nhóm 10</title>
  <desc id="n10Desc">Minh họa quy trình phối hợp 3 giai đoạn và hệ sinh thái công cụ số của Nhóm 10 cho dự án AI và Công nghệ số trong giảng dạy và học tập Âm nhạc THCS</desc>
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#131b3a"/>
      <stop offset="100%" stop-color="#1e2b58"/>
    </linearGradient>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="580" rx="18" fill="#f8fafc"/>
  <rect x="1" y="1" width="1098" height="578" rx="17" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="20" y="18" width="1060" height="76" rx="12" fill="url(#headerBg)"/>
  <text x="550" y="48" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff">QUY TRÌNH HỢP TÁC TRỰC TUYẾN 3 GIAI ĐOẠN — NHÓM 10 (NGÀNH SPAN)</text>
  <text x="550" y="74" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="#fde68a">Đề tài: AI &amp; Công nghệ số trong giảng dạy và học tập Âm nhạc THCS • GVHD: Vũ Việt Hoàng • 5 Thành viên</text>

  <!-- Phase 1 Column -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="114" width="320" height="334" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 28 128 Q 28 114 42 114 L 334 114 Q 348 114 348 128 L 348 164 L 28 164 Z" fill="url(#col1Grad)"/>
    <text x="48" y="145" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GIAI ĐOẠN 1: Ý TƯỞNG &amp; NGHIÊN CỨU</text>
  </g>
  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="#334155">
    <rect x="44" y="178" width="288" height="58" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="56" y="198" font-weight="700" fill="#0369a1">Định hướng mô hình chung</text>
    <text x="56" y="216" font-size="12">Họp nhóm trực tuyến trên Google Meet,</text>
    <text x="56" y="230" font-size="12">chốt đề tài Âm nhạc THCS &amp; tiêu chí.</text>

    <rect x="44" y="246" width="288" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="266" font-weight="700" fill="#0f172a">Lớp học Âm nhạc thông minh 4.0</text>
    <text x="56" y="284" font-size="12">Khảo sát, dùng thử &amp; chọn lọc công cụ</text>
    <text x="56" y="297" font-size="12">phù hợp chương trình Âm nhạc THCS.</text>

    <rect x="44" y="310" width="288" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="331" font-weight="700" fill="#0f172a">Phân công 5 mảng nhiệm vụ</text>
    <text x="56" y="350" font-size="12">Lập bảng việc, mốc deadline &amp; quy ước file.</text>

    <rect x="44" y="376" width="288" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="396" font-weight="700" fill="#1e3a8a" font-size="12">CÔNG CỤ PHỐI HỢP TRỰC TUYẾN</text>
    <text x="56" y="416" font-size="12" fill="#1e40af">Google Meet • Zalo • Trello / Kanban</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="352" y1="280" x2="384" y2="280" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

  <!-- Phase 2 Column -->
  <g filter="url(#cardShadow)">
    <rect x="390" y="114" width="320" height="334" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 390 128 Q 390 114 404 114 L 696 114 Q 710 114 710 128 L 710 164 L 390 164 Z" fill="url(#col2Grad)"/>
    <text x="410" y="145" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GIAI ĐOẠN 2: NỘI DUNG &amp; HỌC LIỆU</text>
  </g>
  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#334155">
    <rect x="406" y="180" width="288" height="122" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="418" y="200" font-weight="700" fill="#92400e">5 Thành viên triển khai song song:</text>
    <text x="418" y="220"><tspan font-weight="700" fill="#131b3a">1. Tô Đức Thịnh:</tspan> Tổng quan &amp; AI soạn giảng</text>
    <text x="418" y="239"><tspan font-weight="700" fill="#131b3a">2. Vũ Đức Thịnh:</tspan> AI trong hát &amp; nhạc cụ</text>
    <text x="418" y="258"><tspan font-weight="700" fill="#131b3a">3. Bùi Minh Thuỳ:</tspan> Đọc nhạc, lý thuyết, KT</text>
    <text x="418" y="277"><tspan font-weight="700" fill="#131b3a">4. Lê Phương Thảo:</tspan> Thưởng thức âm nhạc</text>
    <text x="418" y="296"><tspan font-weight="700" fill="#131b3a">5. Lê Thị Phương Thảo:</tspan> Kịch bản tiết 40 phút</text>

    <rect x="406" y="312" width="288" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="418" y="332" font-weight="700" fill="#0f172a">Sản phẩm học liệu thực hành</text>
    <text x="418" y="350" font-size="12">Tách beat, số hóa nốt, tạo ảnh &amp; quiz ôn tập.</text>

    <rect x="406" y="376" width="288" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="418" y="396" font-weight="700" fill="#92400e" font-size="12">AI &amp; ỨNG DỤNG ÂM NHẠC</text>
    <text x="418" y="416" font-size="11.5" fill="#78350f">ChatGPT • Gemini • Moises • MuseScore • Suno • Quizizz</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="714" y1="280" x2="746" y2="280" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

  <!-- Phase 3 Column -->
  <g filter="url(#cardShadow)">
    <rect x="752" y="114" width="320" height="334" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 752 128 Q 752 114 766 114 L 1058 114 Q 1072 114 1072 128 L 1072 164 L 752 164 Z" fill="url(#col3Grad)"/>
    <text x="772" y="145" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GIAI ĐOẠN 3: SẢN XUẤT &amp; HOÀN THIỆN</text>
  </g>
  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#334155">
    <rect x="768" y="180" width="288" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="780" y="201" font-weight="700" fill="#0f766e">Ghi hình &amp; Thu màn hình thao tác</text>
    <text x="780" y="220" font-size="12">Quay thuyết trình + demo Moises, Perfect Piano.</text>

    <rect x="768" y="248" width="288" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="780" y="269" font-weight="700" fill="#0f172a">Hậu kỳ &amp; Lọc tạp âm môi trường</text>
    <text x="780" y="288" font-size="12">Xử lý tiếng ồn, cắt ghép kịch bản 40 phút.</text>

    <rect x="768" y="316" width="288" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="780" y="336" font-weight="700" fill="#0f172a">Đầu ra chuẩn hóa đa nền tảng</text>
    <text x="780" y="354" font-size="12">Video MP4 (1280×720, 38.78 MB) + Báo cáo Word.</text>

    <rect x="768" y="376" width="288" height="56" rx="8" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="780" y="396" font-weight="700" fill="#115e59" font-size="12">HẬU KỲ &amp; LƯU TRỮ CHIA SẺ</text>
    <text x="780" y="416" font-size="12" fill="#134e4a">CapCut • Canva • Premiere • Google Drive</text>
  </g>

  <!-- Bottom Collaboration Infrastructure Bar -->
  <rect x="28" y="468" width="1044" height="90" rx="12" fill="#131b3a"/>
  <text x="52" y="495" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">HẠ TẦNG ĐỒNG BỘ ĐA HỆ ĐIỀU HÀNH (iOS • Android • Windows)</text>
  <text x="52" y="518" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#e2e8f0">• Kho lưu trữ dùng chung: Google Drive phân thư mục theo Phần 1–5, thống nhất xuất chuẩn MP4 (H.264) &amp; PDF/DOCX trước khi ghép.</text>
  <text x="52" y="540" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#93c5fd">• Kiểm soát chất lượng chung: Lọc tạp âm hậu kỳ • Tinh chỉnh Prompt hợp văn hóa Việt Nam • Cân đối công nghệ trong tiết dạy 40 phút.</text>
</svg>
